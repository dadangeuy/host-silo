name: Proxmox (Docker)
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy docker update
    environment: proxmox
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: '${{ secrets.TS_OAUTH_CLIENT_ID }}'
          audience: '${{ secrets.TS_AUDIENCE }}'
          tags: 'tag:github'
      - name: Update silo-1
        env:
          SSHPASS: '${{ secrets.SSH_PASSWORD }}'
        run: sshpass -e ssh -o StrictHostKeyChecking=accept-new user@silo-1 "bash -lc 'cd /docker/services/${{ github.event.repository.name }}/docker && make update'"
permissions:
  id-token: write
