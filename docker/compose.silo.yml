services:
  silo:
    image: docker.io/pgsty/silo:latest
    command: 'server --console-address ":9001" /data'
    env_file:
      - ./environment/silo.default.env
      - ./environment/silo.${STAGE:-default}.env
      - ./storage/secret/silo.default.env
      - ./storage/secret/silo.${STAGE:-default}.env
    volumes:
      - ./storage/silo/data:/data
    network_mode: container:tailscale
    healthcheck:
      test: 'silo healthcheck ready'